<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284c7'><path d='M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Water - Giám sát Cấp nước</title>
    <meta name="description" content="Giám sát áp lực, lưu lượng và rò rỉ mạng lưới cấp nước." />
    
    <!-- Global Error Catcher -->
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var box = document.getElementById('debug-error-box');
        if (!box) {
          box = document.createElement('div');
          box.id = 'debug-error-box';
          box.style = 'position:fixed;top:0;left:0;right:0;background:#fee2e2;color:#991b1b;padding:24px;border-bottom:3px solid #ef4444;z-index:999999;font-family:monospace;';
          document.body.prepend(box);
        }
        box.innerHTML = '<h3>⚠️ Lỗi Trình Duyệt:</h3><p><b>' + msg + '</b></p><p>File: ' + url + ' (dòng ' + line + ')</p><pre>' + (error && error.stack ? error.stack : '') + '</pre>';
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script type="module" src="/main.jsx"></script>
  </head>
  <body>
    <div id="root">
      <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f8fafc; color: #0284c7;">
        <div style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Đang tải Smart Water Management...</div>
        <div style="font-size: 13px; color: #64748b;">Vui lòng chờ trong giây lát hoặc nhấn F5 / Ctrl+R nếu chưa hiển thị.</div>
      </div>
    </div>
  </body>
</html>
